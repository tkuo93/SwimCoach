<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SwimCoach - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf8f4;
  --surface: #ffffff;
  --border: #e8e2d8;
  --border-light: #f0ebe3;
  --sage: #5b7a5e;
  --sage-light: #e8efe6;
  --sage-dark: #3d5440;
  --coral: #e8654a;
  --coral-light: #fdf0ec;
  --text: #1a1a1a;
  --text-sec: #6b6560;
  --text-mut: #9e978e;
  --font-d: 'Fraunces', serif;
  --font-b: 'Inter Tight', sans-serif;
  --font-m: 'JetBrains Mono', monospace;
  --r: 20px;
  --rs: 12px;
  --rf: 100px;
  --sh: 0 4px 16px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:#f0ebe3;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;color:var(--text);-webkit-font-smoothing:antialiased}
.phone{width:375px;height:750px;background:var(--cream);border-radius:48px;box-shadow:0 12px 40px rgba(0,0,0,0.08);position:relative;display:flex;flex-direction:column}
.phone-content{flex:1;overflow-y:auto;overflow-x:hidden}
.status-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-family:var(--font-m);font-size:12px;font-weight:500;color:var(--text-sec)}
.screen{display:none;flex-direction:column;flex:1;animation:fadeUp .4s cubic-bezier(.16,1,.3,1);min-height:0}
.screen.active{display:flex}
.screen-content{flex:1;overflow-y:auto;min-height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px}
.top-bar h1{font-family:var(--font-d);font-size:18px;font-weight:600;letter-spacing:-.01em;flex:1}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:var(--r);font-family:var(--font-d);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 4px 20px rgba(232,101,74,.2)}
.btn-outline{background:transparent;color:var(--text-sec);border:1.5px solid var(--border)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-google:hover{border-color:var(--sage);background:var(--sage-light)}
.btn-google:active{transform:scale(.97)}
.btn-google svg{width:20px;height:20px}
.login-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 32px;text-align:center}
.login-hero{margin-bottom:40px}
.login-logo{font-size:64px;margin-bottom:16px;opacity:.8}
.login-title{font-family:var(--font-d);font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text-sec);line-height:1.5}
.login-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:16px}
.login-divider{display:flex;align-items:center;gap:12px;color:var(--text-mut);font-size:12px;margin:8px 0}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.error-msg{background:var(--coral-light);color:var(--coral);padding:12px 16px;border-radius:var(--rs);font-size:13px;display:none}
.error-msg.visible{display:block}
.loading-spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--sage);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-loading .btn-text{display:none}
.btn-loading .loading-spinner{display:inline-block}
.footer{margin-top:32px;font-size:12px;color:var(--text-mut)}
.footer a{color:var(--sage);text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="color:var(--sage)">●●●●○</span></div>
  <div class="screen active" id="loginScreen">
    <div class="login-view">
      <div class="login-hero">
        <div class="login-logo">🏊</div>
        <h2 class="login-title">SwimCoach</h2>
        <p class="login-sub">Personalized swim and gym workouts, plus an AI coach powered by sports science research.</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="error-msg" id="errorMsg"></div>
        <button type="button" class="btn btn-google" id="googleBtn">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="btn-text">Continue with Google</span>
          <div class="loading-spinner"></div>
        </button>
      </form>
      <div class="footer">
        <p>By continuing, you agree to our <a href="/privacy.html">Privacy Policy</a> and <a href="/terms.html">Terms of Service</a>.</p>
      </div>
    </div>
  </div>
</div>

<script>
// Check auth state on load
async function checkAuth() {
  try {
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    const data = await res.json();
    if (data.authenticated && data.user) {
      // Authenticated - redirect to main app
      window.location.href = '/';
    }
    // Not authenticated - stay on login page
  } catch (err) {
    console.error('Auth check failed:', err);
  }
}

document.getElementById('googleBtn').addEventListener('click', () => {
  const btn = document.getElementById('googleBtn');
  btn.classList.add('btn-loading');
  btn.disabled = true;

  // Redirect to Google OAuth
  window.location.href = '/api/auth/google?redirect=/';
});

checkAuth();
</script>
</body>
</html>
