# fly.toml - Fly.io configuration for SwimCoach
app = "swimcoach"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"

# Health checks
[health_check]
  type = "http"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"